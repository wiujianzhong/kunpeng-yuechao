<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>PPT授权管理｜小伍工作室</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#1e293b;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.card{box-sizing:border-box;width:min(440px,92vw);padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.12)}h1{margin:0 0 6px;font-size:24px}.tip{margin:0 0 20px;color:#64748b}.field{display:block;margin:14px 0 6px;font-weight:700}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;font:inherit}input,textarea{border:1px solid #cbd5e1}textarea{resize:vertical}button{margin-top:14px;border:0;background:#16a34a;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e2e8f0;color:#334155}.status{min-height:24px;margin-top:12px;color:#b91c1c}.back{display:block;margin-top:18px;text-align:center;color:#15803d;text-decoration:none}
  </style>
</head>
<body><main class="card">
  <h1>PPT授权管理</h1>
  <p class="tip">仅供管理员生成现有兼容格式的一年授权码。</p>
  <form id="admin-form">
    <label class="field" for="machine-code">客户机器码</label>
    <input id="machine-code" autocomplete="off" required>
    <label class="field" for="admin-password">管理员密码</label>
    <input id="admin-password" type="password" autocomplete="current-password" required>
    <button id="generate-button" type="submit">生成一年授权码</button>
  </form>
  <label class="field" for="result">生成结果</label>
  <textarea id="result" rows="4" readonly></textarea>
  <button id="copy-button" class="secondary" type="button">复制授权码</button>
  <p id="status" class="status" aria-live="polite"></p>
  <a class="back" href="./">返回嘉新PPT工具</a>
  <script>
    const form = document.getElementById('admin-form');
    const result = document.getElementById('result');
    const status = document.getElementById('status');
    const generateButton = document.getElementById('generate-button');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      result.value = '';
      status.textContent = '';
      generateButton.disabled = true;
      generateButton.textContent = '正在生成…';
      try {
        const response = await fetch('https://pptsq.xiaowustudio.cn/api/license/admin/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            machineCode: document.getElementById('machine-code').value.trim(),
            password: document.getElementById('admin-password').value,
            days: 365
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || '生成失败');
        result.value = data.code;
        status.style.color = '#15803d';
        status.textContent = `生成成功，有效期至 ${new Date(data.expiry).toLocaleDateString('zh-CN')}`;
      } catch (error) {
        status.style.color = '#b91c1c';
        status.textContent = error.message || '授权服务暂时不可用';
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = '生成一年授权码';
      }
    });
    document.getElementById('copy-button').addEventListener('click', async () => {
      if (!result.value) return;
      try {
        await navigator.clipboard.writeText(result.value);
        status.style.color = '#15803d';
        status.textContent = '授权码已复制';
      } catch (_) {
        result.select();
        status.style.color = '#b45309';
        status.textContent = '请长按或手动复制授权码';
      }
    });
  </script>
</main></body>
</html>

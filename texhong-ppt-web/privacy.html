<h1>天虹问题整改PPT · 隐私说明</h1>
<p>天虹版面向所有人开放，无需注册或输入设备码。</p>
<h2>照片、文字和文件</h2>
<p>问题照片、说明、导入的 PPT 和生成的文件由当前浏览器在本机处理。导出的文件保存到你选择的位置。</p>
<h2>草稿和操作记录</h2>
<p>浏览器在本机保存草稿、照片、语言偏好和近期操作记录。页面顶部的“清空全部内容”可清除当前工作草稿；清除浏览器的站点数据会移除该站点的本机记录。重要文件请先导出。</p>
<h2>网站访问</h2>
<p>正式站使用 Cloudflare 提供网站访问服务，并加载小伍工作室的访问统计脚本。照片和整改说明不会随访问统计提交。</p>

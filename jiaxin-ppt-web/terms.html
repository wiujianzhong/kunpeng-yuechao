<h1>嘉新问题整改PPT · 使用说明</h1>
<p>任何人打开网页都可以制作问题整改 PPT，中文和中文加拼音两种导出方式均可直接使用。</p>
<h2>制作报告</h2>
<p>上传照片或导入已有 PPT，填写整改说明，再点“一键生成PPT”。导出使用嘉新公司模板。建议保留原始照片和下载的文件，以便更换设备时继续使用。</p>
<h2>日常打开</h2>
<p>首页的桌面入口会按浏览器能力发起安装，或显示手动添加步骤。在微信和手机 QQ 内无法下载时，可从菜单选择“在浏览器打开”。</p>
<h2>源码与支持</h2>
<p><a href="https://github.com/wiujianzhong/kunpeng-yuechao/tree/main/ppt-tools-source">在 GitHub 查看两套工具源码和本地运行方法</a>。使用问题可通过<a href="https://xiaowustudio.cn/">小伍工作室</a>反馈。</p>

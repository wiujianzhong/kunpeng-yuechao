<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17211d">
  <meta name="description" content="把纺织设备老师傅的隐性维修经验持续萃取为企业结构化知识资产。">
  <title>纺织设备老师傅经验萃取系统</title>
  <link rel="icon" href="assets/caresun-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="side-rail" aria-label="主导航">
      <div class="brand-block">
        <img src="assets/caresun-logo.png" alt="嘉新国际集团有限公司" class="brand-logo">
        <div>
          <strong>经验萃取系统</strong>
          <span>维修知识生产线</span>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item is-active" data-view="home" type="button"><span aria-hidden="true">⌂</span><b>今日工作</b></button>
        <button class="nav-item" data-view="interview" type="button"><span aria-hidden="true">◎</span><b>AI萃取采访</b></button>
        <button class="nav-item" data-view="equipment" type="button"><span aria-hidden="true">▦</span><b>设备与知识</b></button>
        <button class="nav-item" data-view="audit" type="button"><span aria-hidden="true">✓</span><b>知识体检</b></button>
      </nav>
      <div class="rail-note">
        <span class="status-dot"></span>
        <div><strong>Mock AI 已就绪</strong><small>无密钥也能完整演示</small></div>
      </div>
      <div class="rail-actions">
        <button class="text-button" id="export-data" type="button">导出数据</button>
        <button class="text-button" id="import-data" type="button">导入数据</button>
        <input id="import-data-file" type="file" accept="application/json" hidden>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="view-eyebrow">今日工作台</p>
          <h1 id="view-title">把老师傅的判断过程留下来</h1>
        </div>
        <div class="topbar-actions">
          <span class="autosave" id="autosave-state"><i></i>已自动保存</span>
          <button class="secondary-button desktop-only" id="register-source" type="button">登记资料</button>
          <button class="primary-button" id="start-interview" type="button">＋ 开始采访</button>
        </div>
      </header>

      <main id="app-main" tabindex="-1"></main>
    </section>
  </div>

  <nav class="mobile-nav" aria-label="手机主导航">
    <button class="mobile-nav-item is-active" data-view="home" type="button"><span>⌂</span><b>今日</b></button>
    <button class="mobile-nav-item" data-view="interview" type="button"><span>◎</span><b>采访</b></button>
    <button class="mobile-nav-item" data-view="equipment" type="button"><span>▦</span><b>知识</b></button>
    <button class="mobile-nav-item" data-view="audit" type="button"><span>✓</span><b>体检</b></button>
  </nav>

  <dialog id="interview-dialog" class="app-dialog">
    <form method="dialog" id="interview-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">NEW INTERVIEW</p><h2>开始一次知识萃取</h2></div>
        <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
      </div>
      <div class="form-grid">
        <label>工序<select id="form-process" required></select></label>
        <label>设备 / 型号<select id="form-equipment" required></select></label>
        <label>采访老师傅<select id="form-expert" required></select></label>
        <label>知识类型
          <select id="form-knowledge-type" required>
            <option value="fault">故障诊断</option>
            <option value="repair">维修方法</option>
            <option value="inspection">检查方法</option>
            <option value="parameter">参数</option>
            <option value="principle">设备原理</option>
            <option value="case">历史案例</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label class="full-field">本次主题<input id="form-interview-title" required placeholder="例如：相机画面不刷新怎么判断"></label>
        <label class="full-field">采访方式
          <span class="segmented-control">
            <input type="radio" name="mode" value="field" id="mode-field" checked><span>现场采访</span>
            <input type="radio" name="mode" value="desk" id="mode-desk"><span>桌面整理</span>
          </span>
        </label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" type="submit">取消</button>
        <button class="primary-button" id="create-interview-submit" value="default" type="submit">进入采访台</button>
      </div>
    </form>
  </dialog>

  <dialog id="source-dialog" class="app-dialog">
    <form method="dialog" id="source-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">SOURCE REGISTER</p><h2>登记一份原始资料</h2></div>
        <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
      </div>
      <div class="form-grid">
        <label>设备<select id="source-equipment" required></select></label>
        <label>资料类型
          <select id="source-type" required>
            <option value="manufacturer_manual">厂家说明书</option>
            <option value="drawing">电气图 / 机械图</option>
            <option value="parts_manual">零件手册</option>
            <option value="sop">企业SOP</option>
            <option value="maintenance_record">维修记录</option>
            <option value="case_report">历史案例 / 月报</option>
            <option value="photo">设备 / 铭牌照片</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label class="full-field">资料名称<input id="source-title" required placeholder="例如：JWF0019A电气图"></label>
        <label>版本 / 日期<input id="source-version" placeholder="例如：2026-08"></label>
        <label>文件名<input id="source-filename" placeholder="可只登记文件名"></label>
        <label class="full-field">备注<textarea id="source-notes" rows="3" placeholder="写清这份资料能回答什么，避免重复问老师傅"></textarea></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" type="submit">取消</button>
        <button class="primary-button" id="create-source-submit" value="default" type="submit">保存资料</button>
      </div>
    </form>
  </dialog>

  <dialog id="photo-dialog" class="app-dialog compact-dialog">
    <form method="dialog" id="photo-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">FIELD PHOTO</p><h2>添加现场照片</h2></div>
        <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
      </div>
      <label class="capture-zone">
        <input id="photo-input" type="file" accept="image/*" capture="environment">
        <span>拍照或选择照片</span>
        <small>系统只保存压缩缩略图，原图请另行保留</small>
      </label>
      <label>位置/说明<input id="photo-note" placeholder="例如：主屏右侧报警区"></label>
      <div id="photo-preview" class="photo-preview is-empty">尚未选择照片</div>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" type="submit">取消</button>
        <button class="primary-button" id="save-photo-submit" value="default" type="submit">加入本次记录</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="app-dialog compact-dialog">
    <form method="dialog">
      <div class="dialog-heading"><h2 id="confirm-title">确认操作</h2></div>
      <p id="confirm-message" class="dialog-message"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" type="submit">取消</button>
        <button class="danger-button" id="confirm-ok" value="default" type="submit">确认</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script defer src="https://xiaowustudio.cn/assets/analytics.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>

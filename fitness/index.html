<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小伍健身动作库</title>
    <meta name="description" content="小伍健身动作库：1324 个健身动作，中文步骤、器械筛选、肌群筛选和动作 GIF。" />
    <meta name="theme-color" content="#17212b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小伍动作库" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="icon-search" viewBox="0 0 24 24">
        <path d="m21 21-4.3-4.3" />
        <circle cx="11" cy="11" r="7" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol id="icon-filter" viewBox="0 0 24 24">
        <path d="M4 6h16M7 12h10M10 18h4" />
      </symbol>
      <symbol id="icon-shuffle" viewBox="0 0 24 24">
        <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
      </symbol>
      <symbol id="icon-bookmark" viewBox="0 0 24 24">
        <path d="M6 4h12v17l-6-4-6 4Z" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="小伍健身动作库首页">
          <span class="brand-mark">伍</span>
          <span>
            <span class="brand-kicker">小伍工作室</span>
            <strong>小伍健身动作库</strong>
          </span>
        </a>
        <button class="icon-button" id="randomBtn" type="button" aria-label="随机动作" title="随机动作">
          <svg><use href="#icon-shuffle"></use></svg>
        </button>
      </header>

      <main id="top">
        <section class="command-surface" aria-label="动作筛选">
          <div class="search-row">
            <label class="search-box">
              <svg><use href="#icon-search"></use></svg>
              <input id="searchInput" type="search" autocomplete="off" placeholder="搜索动作、肌群、器械" />
            </label>
            <button class="icon-button filter-button" id="filterToggle" type="button" aria-label="筛选" title="筛选">
              <svg><use href="#icon-filter"></use></svg>
            </button>
          </div>

          <div class="mode-row" role="tablist" aria-label="查看范围">
            <button class="mode-pill is-active" type="button" data-mode="all" role="tab" aria-selected="true">全部</button>
            <button class="mode-pill" type="button" data-mode="bodyweight" role="tab" aria-selected="false">徒手</button>
            <button class="mode-pill" type="button" data-mode="favorites" role="tab" aria-selected="false">收藏</button>
          </div>

          <div class="filters" id="filtersPanel" hidden>
            <label>
              <span>部位</span>
              <select id="categorySelect"></select>
            </label>
            <label>
              <span>器械</span>
              <select id="equipmentSelect"></select>
            </label>
            <label>
              <span>目标</span>
              <select id="targetSelect"></select>
            </label>
          </div>

          <div class="status-strip" aria-live="polite">
            <div>
              <strong id="matchCount">0</strong>
              <span>匹配</span>
            </div>
            <div>
              <strong id="totalCount">1324</strong>
              <span>动作</span>
            </div>
            <div>
              <strong id="favoriteCount">0</strong>
              <span>收藏</span>
            </div>
          </div>
        </section>

        <section class="muscle-board" aria-label="身体部位">
          <div class="section-title">
            <h2>按身体部位</h2>
            <span id="activeLabel">全部动作</span>
          </div>
          <div class="category-rail" id="categoryRail"></div>
        </section>

        <section class="results-section" aria-label="动作列表">
          <div class="section-title">
            <h2>动作列表</h2>
            <span id="visibleLabel">正在载入</span>
          </div>
          <div class="exercise-grid" id="exerciseGrid"></div>
          <button class="load-more" id="loadMoreBtn" type="button" hidden>加载更多</button>
          <div class="empty-state" id="emptyState" hidden>
            <strong>没找到匹配动作</strong>
            <span>换个关键词或清空筛选。</span>
          </div>
        </section>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="detail-drawer" id="detailDrawer" aria-hidden="true" aria-label="动作详情">
      <div class="drawer-head">
        <button class="icon-button" id="closeDrawerBtn" type="button" aria-label="关闭" title="关闭">
          <svg><use href="#icon-x"></use></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <template id="cardTemplate">
      <article class="exercise-card">
        <button class="card-main" type="button">
          <span class="media-wrap">
            <img alt="" loading="lazy" />
          </span>
          <span class="card-copy">
            <span class="card-kicker"></span>
            <strong></strong>
            <span class="card-original"></span>
            <span class="card-meta"></span>
          </span>
          <svg class="card-chevron"><use href="#icon-chevron"></use></svg>
        </button>
        <button class="save-button" type="button" aria-label="收藏动作" title="收藏动作">
          <svg><use href="#icon-bookmark"></use></svg>
        </button>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>

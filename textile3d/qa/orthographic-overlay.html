<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>厂家视图与3D正投影叠合验收</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf1ed;color:#102422;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:18px 28px;background:#10383c;color:#fff}header h1{margin:0 0 5px;font-size:20px}header p{margin:0;color:#b6d4cb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:18px}.card{background:#fff;border:1px solid #cad5cf}.card h2{margin:0;padding:13px 15px;border-bottom:1px solid #d8e0da;font-size:16px}.stage{position:relative;height:520px;background:#fff;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.source{z-index:1}.projection{z-index:2;mix-blend-mode:multiply;pointer-events:none}.meta{display:grid;gap:7px;padding:13px 15px;border-top:1px solid #d8e0da;font-size:13px;line-height:1.55}.meta strong{color:#4e9b36}.legend{display:flex;gap:18px;padding:0 15px 14px;color:#657572;font-size:12px}.legend span:before{content:"";display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle;background:#111}.legend .model:before{background:#ff245e}@media(max-width:900px){.grid{grid-template-columns:1fr}.stage{height:420px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"}}</script>
</head>
<body>
  <header><h1>厂家视图 × 3D正投影叠合验收</h1><p id="summary">黑线是厂家实体图，红线是3D模型正投影；红黑不能重合就必须重做。</p></header>
  <main class="grid" id="grid"></main>
  <script type="module" src="orthographic-overlay.js?v=3"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>排列组合可视化 · 中文精修版</title>
    <style>
:root {
  --ink: #16212a;
  --muted: #64717d;
  --paper: #edf3f5;
  --panel: #ffffff;
  --line: #d5e0e6;
  --teal: #0f7182;
  --blue: #4267d6;
  --coral: #e6674f;
  --gold: #e3b341;
  --green: #2d9a6b;
  --violet: #6957c8;
  --shadow: 0 18px 42px rgba(22, 33, 42, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(90deg, rgba(15, 113, 130, 0.08) 1px, transparent 1px),
    linear-gradient(0deg, rgba(15, 113, 130, 0.08) 1px, transparent 1px),
    radial-gradient(circle at 10% 10%, rgba(227, 179, 65, 0.16), transparent 28%),
    var(--paper);
  background-size: 26px 26px, 26px 26px, auto, auto;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: min(1220px, calc(100vw - 28px));
  margin: 0 auto;
  padding: 26px 0 44px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 18px;
  align-items: stretch;
  min-height: 210px;
}

.hero-copy,
.quick-card,
.mode-board,
.control-panel,
.visual-panel,
.formula-panel,
.quiz-panel {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: var(--shadow);
}

.hero-copy {
  position: relative;
  overflow: hidden;
  padding: 30px;
}

.hero-copy::after {
  content: "甲 乙 丙";
  position: absolute;
  right: 24px;
  bottom: -26px;
  color: rgba(15, 113, 130, 0.08);
  font-size: 118px;
  font-weight: 900;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--coral);
  font-size: 13px;
  font-weight: 900;
}

h1,
h2 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  max-width: 760px;
  font-size: clamp(34px, 5vw, 64px);
  line-height: 1.03;
}

h2 {
  font-size: 24px;
}

.hero-text,
.mode-copy p,
.tiny {
  color: var(--muted);
  line-height: 1.75;
}

.hero-text {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 18px 0 0;
  font-size: 18px;
}

.quick-card {
  display: grid;
  align-content: center;
  gap: 8px;
  padding: 24px;
  background: #12212a;
  color: #fff;
}

.quick-card span {
  color: #b9c8d0;
}

.quick-card strong {
  font-size: 34px;
  line-height: 1;
}

.mode-board {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin: 18px 0;
  padding: 20px;
}

.mode-copy p {
  margin: 8px 0 0;
}

.mode-toggle,
.quiz-actions,
.stepper-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-btn,
.primary-btn,
.secondary-btn,
.ghost-btn,
.icon-btn {
  min-height: 44px;
  border-radius: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-weight: 900;
}

.mode-btn.active,
.primary-btn {
  border-color: var(--teal);
  background: var(--teal);
  color: #fff;
}

.ghost-btn {
  background: transparent;
}

.workbench {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 360px;
  gap: 18px;
}

.control-panel,
.visual-panel,
.formula-panel,
.quiz-panel {
  padding: 20px;
}

.panel-title {
  margin-bottom: 16px;
}

.input-label {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-weight: 900;
}

.input-label input {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--ink);
  font-size: 20px;
  font-weight: 900;
}

.tiny {
  margin: 10px 0 18px;
  font-size: 13px;
}

.stepper {
  display: grid;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8fbfc;
}

.stepper span {
  color: var(--muted);
  font-weight: 900;
}

.stepper-row {
  align-items: center;
}

.stepper-row strong {
  min-width: 54px;
  text-align: center;
  font-size: 32px;
}

.icon-btn {
  width: 46px;
  padding: 0;
  font-size: 24px;
}

.story-box,
.formula,
.compare,
.answer-box {
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  line-height: 1.65;
}

.story-box {
  border-left: 5px solid var(--gold);
  background: #fff7dd;
}

.visual-panel {
  min-height: 540px;
}

.people-tray,
.slots,
.result-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.people-tray {
  min-height: 82px;
  margin-bottom: 20px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8fbfc;
}

.person-card,
.slot-card,
.result-card {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-weight: 900;
}

.person-card {
  width: 58px;
  height: 58px;
  color: #fff;
  box-shadow: 0 10px 18px rgba(22, 33, 42, 0.12);
}

.slot-card {
  position: relative;
  flex: 1 1 130px;
  min-height: 118px;
  border: 2px dashed #b6c6cf;
  background: #fbfdfe;
  color: var(--muted);
}

.slot-card.filled {
  border-style: solid;
  background: #edf9f8;
  color: var(--teal);
}

.slot-card small {
  position: absolute;
  left: 12px;
  top: 10px;
  color: var(--muted);
  font-size: 12px;
}

.slot-card strong {
  font-size: 38px;
}

.slot-card.active {
  animation: pop 580ms ease both;
}

@keyframes pop {
  0% {
    transform: translateY(0) scale(1);
  }
  45% {
    transform: translateY(-10px) scale(1.04);
    border-color: var(--coral);
  }
  100% {
    transform: translateY(0) scale(1);
  }
}

.formula {
  border-left: 5px solid var(--teal);
  background: #e9f7f9;
  font-weight: 900;
}

.compare {
  border-left: 5px solid var(--coral);
  background: #fff0eb;
  color: #8a3d2f;
}

.result-grid {
  max-height: 306px;
  overflow: auto;
  margin-top: 16px;
  padding-right: 4px;
}

.result-card {
  min-width: 70px;
  min-height: 38px;
  padding: 8px 10px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 14px;
}

.result-card.marked {
  border-color: var(--coral);
  background: #fff0eb;
}

.quiz-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.9fr);
  gap: 16px;
  align-items: center;
  margin-top: 18px;
}

.quiz-text {
  margin: 10px 0 0;
  font-size: 20px;
  font-weight: 900;
  line-height: 1.6;
}

.answer-box {
  grid-column: 1 / -1;
  margin: 0;
  border-left: 5px solid var(--blue);
  background: #eef2ff;
}

.good {
  border-left-color: var(--green);
  background: #e8f8ef;
  color: #21734e;
}

.bad {
  border-left-color: var(--coral);
  background: #fff0eb;
  color: #8a3d2f;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}

@media (max-width: 980px) {
  .hero,
  .workbench,
  .quiz-panel {
    grid-template-columns: 1fr;
  }

  .mode-board {
    align-items: stretch;
    flex-direction: column;
  }

  .quick-card {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  .app {
    width: min(100vw - 18px, 520px);
    padding-top: 12px;
  }

  .hero-copy,
  .quick-card,
  .mode-board,
  .control-panel,
  .visual-panel,
  .formula-panel,
  .quiz-panel {
    padding: 16px;
  }

  h1 {
    font-size: 38px;
  }

  .quick-card {
    grid-template-columns: 1fr;
  }

  .slot-card {
    flex-basis: 100%;
  }
}

    </style>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <section class="hero-copy">
          <p class="eyebrow">第二个项目 · 中文二次加工</p>
          <h1>先别背公式，先看顺序</h1>
          <p class="hero-text">
            同一批人，拿来排座位就是排列；拿来选小组就是组合。这个页面只训练一件事：
            <strong>顺序到底重不重要。</strong>
          </p>
        </section>
        <section class="quick-card" aria-label="核心口诀">
          <span>排队、排名、分职位</span>
          <strong>用排列</strong>
          <span>选人、抽题、组队</span>
          <strong>用组合</strong>
        </section>
      </header>

      <section class="mode-board">
        <div class="mode-copy">
          <p class="eyebrow">第一步</p>
          <h2>这题讲不讲顺序？</h2>
          <p id="modeHint">排成一排，甲乙和乙甲不一样，所以要把顺序算进去。</p>
        </div>
        <div class="mode-toggle" role="group" aria-label="切换排列或组合">
          <button class="mode-btn active" type="button" data-mode="perm">排队：排列</button>
          <button class="mode-btn" type="button" data-mode="comb">组队：组合</button>
        </div>
      </section>

      <section class="workbench">
        <aside class="control-panel">
          <div class="panel-title">
            <p class="eyebrow">素材</p>
            <h2>换一批人试试</h2>
          </div>
          <label class="input-label" for="itemInput">
            输入人名或符号
            <input id="itemInput" type="text" value="甲乙丙丁戊" maxlength="8" />
          </label>
          <p class="tiny">可以输入：甲乙丙丁、红蓝黄绿、苹果梨桃杏。为了不卡，最多取 8 个字。</p>

          <div class="stepper">
            <span>每次取几个？</span>
            <div class="stepper-row">
              <button class="icon-btn" id="minusBtn" type="button" aria-label="减少取法">−</button>
              <strong id="rValue">3</strong>
              <button class="icon-btn" id="plusBtn" type="button" aria-label="增加取法">+</button>
            </div>
          </div>

          <div class="story-box" id="storyBox"></div>
        </aside>

        <section class="visual-panel">
          <div class="panel-title">
            <p class="eyebrow">演示</p>
            <h2 id="sceneTitle">从 5 人里选 3 人排队</h2>
          </div>
          <div class="people-tray" id="peopleTray" aria-label="可选元素"></div>
          <div class="slots" id="slotRow" aria-label="空位"></div>
          <button class="primary-btn" id="playBtn" type="button">播放一次选择过程</button>
        </section>

        <aside class="formula-panel">
          <div class="panel-title">
            <p class="eyebrow">结果</p>
            <h2 id="resultTitle">排列结果</h2>
          </div>
          <div class="formula" id="formulaBox"></div>
          <div class="compare" id="compareBox"></div>
          <div class="result-grid" id="resultGrid" aria-label="结果列表"></div>
        </aside>
      </section>

      <section class="quiz-panel">
        <div>
          <p class="eyebrow">最后过一遍</p>
          <h2>判断一下：该用排列还是组合？</h2>
        </div>
        <p class="quiz-text" id="quizText"></p>
        <div class="quiz-actions">
          <button class="secondary-btn" type="button" data-judge="perm">排列</button>
          <button class="secondary-btn" type="button" data-judge="comb">组合</button>
          <button class="ghost-btn" id="nextQuizBtn" type="button">换一题</button>
        </div>
        <div class="answer-box" id="answerBox">先判断：顺序一换，结果算不算变？</div>
      </section>
    </main>

    <script>
const colors = ["#0f7182", "#e6674f", "#4267d6", "#2d9a6b", "#6957c8", "#b87312", "#b63d72", "#4f6f52"];

const quizList = [
  {
    text: "从 6 个同学里选班长、团支书、学习委员，各 1 人。",
    answer: "perm",
    explain: "职位不同，甲当班长和甲当学习委员不是一回事，所以用排列。",
  },
  {
    text: "从 6 个同学里选 3 人参加活动，不分谁先谁后。",
    answer: "comb",
    explain: "只看选了哪 3 个人，顺序不重要，所以用组合。",
  },
  {
    text: "5 本不同的书，从中拿 3 本摆到书架上。",
    answer: "perm",
    explain: "摆在书架上有位置，顺序一换就变了，所以用排列。",
  },
  {
    text: "从 8 道题里任选 2 道做。",
    answer: "comb",
    explain: "做第 1 题和第 2 题，顺序不影响选题结果，所以用组合。",
  },
];

let mode = "perm";
let items = ["甲", "乙", "丙", "丁", "戊"];
let r = 3;
let quizIndex = 0;

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => Array.from(document.querySelectorAll(selector));

function splitInput(value) {
  const trimmed = value.trim();
  if (!trimmed) return ["甲", "乙", "丙"];
  return Array.from(trimmed).slice(0, 8);
}

function factorial(n) {
  let total = 1;
  for (let i = 2; i <= n; i += 1) total *= i;
  return total;
}

function permute(list, count) {
  if (count === 0) return [[]];
  const result = [];
  list.forEach((item, index) => {
    const rest = list.filter((_, restIndex) => restIndex !== index);
    permute(rest, count - 1).forEach((tail) => result.push([item, ...tail]));
  });
  return result;
}

function combine(list, count, start = 0, path = [], result = []) {
  if (path.length === count) {
    result.push([...path]);
    return result;
  }
  for (let i = start; i < list.length; i += 1) {
    path.push(list[i]);
    combine(list, count, i + 1, path, result);
    path.pop();
  }
  return result;
}

function countResult() {
  const n = items.length;
  if (mode === "perm") return factorial(n) / factorial(n - r);
  return factorial(n) / (factorial(r) * factorial(n - r));
}

function renderPeople() {
  $("#peopleTray").innerHTML = items
    .map((item, index) => `<span class="person-card" style="background:${colors[index % colors.length]}">${item}</span>`)
    .join("");
}

function renderSlots(seed = []) {
  const labels = mode === "perm" ? ["第 1 位", "第 2 位", "第 3 位", "第 4 位", "第 5 位", "第 6 位", "第 7 位", "第 8 位"] : ["选 1 人", "选 2 人", "选 3 人", "选 4 人", "选 5 人", "选 6 人", "选 7 人", "选 8 人"];
  $("#slotRow").innerHTML = Array.from({ length: r }, (_, index) => {
    const value = seed[index] || "?";
    const filled = seed[index] ? "filled" : "";
    return `<div class="slot-card ${filled}" data-slot="${index}"><small>${labels[index]}</small><strong>${value}</strong></div>`;
  }).join("");
}

function renderResultList() {
  const all = mode === "perm" ? permute(items, r) : combine(items, r);
  const shown = all.slice(0, 120);
  $("#resultGrid").innerHTML = shown
    .map((group, index) => {
      const marked = mode === "comb" && group.join("") === items.slice(0, r).join("") ? "marked" : "";
      return `<span class="result-card ${marked}">${group.join(" ")}</span>`;
    })
    .join("");

  if (all.length > shown.length) {
    $("#resultGrid").insertAdjacentHTML("beforeend", `<span class="result-card">还有 ${all.length - shown.length} 个</span>`);
  }
}

function renderFormula() {
  const n = items.length;
  const count = countResult();
  const multiply = Array.from({ length: r }, (_, index) => n - index).join(" × ");
  const repeat = Array.from({ length: r }, (_, index) => r - index).join(" × ");

  if (mode === "perm") {
    $("#formulaBox").innerHTML = `排列：A(${n}, ${r}) = ${multiply} = ${count}`;
    $("#compareBox").innerHTML = `甲乙 和 乙甲 算两种，因为站的位置变了。`;
  } else {
    $("#formulaBox").innerHTML = `组合：C(${n}, ${r}) = (${multiply}) ÷ (${repeat}) = ${count}`;
    $("#compareBox").innerHTML = `甲乙 和 乙甲 算同一种，所以要除掉重复顺序。`;
  }
}

function renderStory() {
  const n = items.length;
  const count = countResult();
  const action = mode === "perm" ? "排成一排" : "组成小组";
  $("#storyBox").textContent = `现在是从 ${n} 个里面取 ${r} 个，${action}，一共有 ${count} 种。`;
  $("#modeHint").textContent = mode === "perm" ? "排成一排，甲乙和乙甲不一样，所以要把顺序算进去。" : "只组成一组，甲乙和乙甲还是同一组，所以不能重复算。";
  $("#sceneTitle").textContent = `从 ${n} 个里取 ${r} 个${mode === "perm" ? "排队" : "组队"}`;
  $("#resultTitle").textContent = mode === "perm" ? "排列结果" : "组合结果";
}

function renderAll() {
  if (r > items.length) r = items.length;
  if (r < 1) r = 1;
  $("#rValue").textContent = r;
  renderPeople();
  renderSlots();
  renderFormula();
  renderStory();
  renderResultList();
}

function playDemo() {
  const sample = mode === "perm" ? permute(items, r)[0] : combine(items, r)[0];
  renderSlots([]);
  sample.forEach((item, index) => {
    setTimeout(() => {
      const current = sample.slice(0, index + 1);
      renderSlots(current);
      const slot = $(`[data-slot="${index}"]`);
      if (slot) slot.classList.add("active");
    }, index * 520);
  });
}

function renderQuiz() {
  const quiz = quizList[quizIndex % quizList.length];
  $("#quizText").textContent = quiz.text;
  $("#answerBox").className = "answer-box";
  $("#answerBox").textContent = "先判断：顺序一换，结果算不算变？";
}

function judgeQuiz(choice) {
  const quiz = quizList[quizIndex % quizList.length];
  const right = choice === quiz.answer;
  $("#answerBox").className = `answer-box ${right ? "good" : "bad"}`;
  $("#answerBox").textContent = `${right ? "对了。" : "错了。"}${quiz.explain}`;
}

$("#itemInput").addEventListener("input", (event) => {
  items = splitInput(event.target.value);
  renderAll();
});

$("#minusBtn").addEventListener("click", () => {
  r -= 1;
  renderAll();
});

$("#plusBtn").addEventListener("click", () => {
  r += 1;
  renderAll();
});

$$(".mode-btn").forEach((button) => {
  button.addEventListener("click", () => {
    mode = button.dataset.mode;
    $$(".mode-btn").forEach((item) => item.classList.toggle("active", item === button));
    renderAll();
  });
});

$("#playBtn").addEventListener("click", playDemo);

$$("[data-judge]").forEach((button) => {
  button.addEventListener("click", () => judgeQuiz(button.dataset.judge));
});

$("#nextQuizBtn").addEventListener("click", () => {
  quizIndex += 1;
  renderQuiz();
});

renderAll();
renderQuiz();

    </script>
  </body>
</html>
